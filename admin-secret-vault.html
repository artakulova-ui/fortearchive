<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>FORTE ARCHIVE — Admin Panel</title>
  <style>
    body { font-family: monospace; padding: 40px; background: #f9f9f9; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 24px; border: 1px solid #eee; }
    label { display: block; margin: 12px 0; }
    input, textarea { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 8px; font: inherit; }
    textarea { height: 250px; }
    button { background: #000; color: #fff; padding: 12px 24px; border: none; cursor: pointer; }
    button:hover { background: #333; }
    #adminPanel[hidden], #loginPanel[hidden] { display: none; }
    #status { margin-top: 16px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h2>FORTE ARCHIVE / Quick Add</h2>
    <section id="loginPanel">
      <p>Войдите в авторизованный аккаунт Firebase для управления каталогом.</p>
      <form id="loginForm">
        <label>Email<input id="emailInput" type="email" autocomplete="username" required></label>
        <label>Пароль<input id="passwordInput" type="password" autocomplete="current-password" required></label>
        <button type="submit">Войти</button>
      </form>
    </section>
    <section id="adminPanel" hidden>
      <p>Вход выполнен: <span id="userEmail"></span></p>
      <button id="signOutBtn" type="button">Выйти</button>
      <p>Вставьте JSON товара для коллекции items:</p>
      <textarea id="jsonInput" placeholder='{"title":"...","category":"tops","code":"...","status":"In Stock","stock":1,"size":"...","description":"...","images":["https://fortearchive.com/images/item.jpg"]}'></textarea>
      <button id="addBtn" type="button">Добавить в Firestore</button>
    </section>
    <div id="status" role="status" aria-live="polite"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const ADMIN_EMAIL = "art.akulova@gmail.com";
    const auth = firebase.auth();
    const db = window.firebaseDb;
    const loginPanel = document.getElementById("loginPanel");
    const adminPanel = document.getElementById("adminPanel");
    const status = document.getElementById("status");

    function showStatus(message, color = "#333") {
      status.textContent = message;
      status.style.color = color;
    }

    auth.onAuthStateChanged(async user => {
      if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL && !user.emailVerified) {
        try {
          await user.sendEmailVerification();
          showStatus("Проверьте почту администратора и подтвердите адрес, затем войдите снова.", "#8a5a00");
        } catch (error) {
          showStatus("Не удалось отправить письмо подтверждения. Попробуйте позже.", "red");
        }
        await auth.signOut();
        return;
      }

      const isAdmin = user
        && user.email
        && user.email.toLowerCase() === ADMIN_EMAIL
        && user.emailVerified;

      loginPanel.hidden = Boolean(isAdmin);
      adminPanel.hidden = !isAdmin;

      if (isAdmin) {
        document.getElementById("userEmail").textContent = user.email;
        showStatus("");
      } else if (user) {
        auth.signOut();
        showStatus("Для доступа нужен подтвержденный аккаунт администратора.", "red");
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const email = document.getElementById("emailInput").value.trim().toLowerCase();
      const password = document.getElementById("passwordInput").value;

      if (email !== ADMIN_EMAIL) {
        showStatus("Этот аккаунт не имеет доступа к админке.", "red");
        return;
      }

      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (error) {
        showStatus("Не удалось войти. Проверьте email и пароль Firebase.", "red");
      }
    });

    document.getElementById("signOutBtn").addEventListener("click", () => auth.signOut());

    document.getElementById("addBtn").addEventListener("click", async () => {
      const rawJson = document.getElementById("jsonInput").value.trim();

      if (!rawJson) {
        showStatus("Поле JSON пустое.", "red");
        return;
      }

      try {
        const itemData = JSON.parse(rawJson);
        if (!itemData || typeof itemData !== "object" || Array.isArray(itemData)) {
          throw new Error("Ожидается JSON-объект товара.");
        }
        if (!Array.isArray(itemData.images) || itemData.images.length < 1 || itemData.images.length > 10) {
          throw new Error("Добавьте от 1 до 10 изображений в массив images.");
        }
        if (!itemData.images.every(url => typeof url === "string" && url.startsWith("https://fortearchive.com/images/"))) {
          throw new Error("Все изображения должны использовать URL https://fortearchive.com/images/.");
        }
        if (!Number.isInteger(Number(itemData.stock)) || Number(itemData.stock) < 0) {
          throw new Error("Поле stock должно быть целым числом не меньше 0.");
        }
        if (!["In Stock", "Sold Out"].includes(itemData.status)) {
          throw new Error("Поле status должно быть In Stock или Sold Out.");
        }
        for (const field of ["title", "category", "code", "size", "description"]) {
          if (typeof itemData[field] !== "string" || !itemData[field].trim()) {
            throw new Error(`Заполните поле ${field}.`);
          }
        }

        itemData.stock = Number(itemData.stock);
        showStatus("Сохранение...", "#666");

        await db.collection("items").add(itemData);

        showStatus(`Товар "${itemData.code || itemData.title}" добавлен.`, "green");
        document.getElementById("jsonInput").value = "";
      } catch (err) {
        console.error(err);
        showStatus("Ошибка: " + err.message, "red");
      }
    });
  </script>
</body>
</html>
